name: STM32F407VG Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test-stm32:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install invoke
      run: pip install invoke

    - name: Generate config for CI
      working-directory: ./examples
      run: inv generate-config

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-stm32f4-${{ hashFiles('docker/stm32f4/Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-buildx-stm32f4-

    - name: Build STM32F407VG firmware
      working-directory: ./examples
      run: inv stm32.http --docker

    - name: Check build artifacts
      run: |
        ls -lh examples/bin/
        test -f examples/bin/http_example_stm32.elf
        test -f examples/bin/http_example_stm32.bin
        test -f examples/bin/http_example_stm32.hex

    - name: Run Renode emulation test
      working-directory: ./examples
      run: inv stm32.renode 2>&1 | tee build_stm32/renode_output.txt
      timeout-minutes: 5

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stm32f407vg-firmware
        path: |
          examples/bin/http_example_stm32.bin
          examples/bin/http_example_stm32.hex
          examples/bin/http_example_stm32.elf
          examples/bin/http_example_stm32.map
          examples/build_stm32/renode_output.txt
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          examples/build_stm32/renode_output.txt
        retention-days: 7
